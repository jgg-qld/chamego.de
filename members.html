<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

  <style>
    body {

      background: #ff69b4;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {

    .video-grid {
